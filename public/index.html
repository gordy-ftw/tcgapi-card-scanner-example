<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card scanner example · TCG API</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --line: #c9c9c4; --text: #1b1b1a; --dim: #6b6b66;
    --accent: #0b6e4f; --warn: #9a5b00; --bad: #a11d1d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121314; --panel: #191b1c; --line: #34373a; --text: #e6e6e3; --dim: #9a9c9e;
            --accent: #4fd1a1; --warn: #e0a84a; --bad: #f07b7b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
           border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; }
  a { color: var(--accent); }
  .dim { color: var(--dim); }
  .box { border: 1px solid var(--line); background: var(--panel); padding: 12px; margin-bottom: 12px; }
  .pick { display: block; border: 1px solid var(--text); padding: 10px 12px; text-align: center;
          cursor: pointer; font-weight: 600; }
  .pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #preview { display: block; max-width: 100%; max-height: 260px; margin-top: 12px; border: 1px solid var(--line); }
  #preview[hidden] { display: none; }
  #status { margin: 0; font-weight: 600; }
  #status[data-kind="matched"] { color: var(--accent); }
  #status[data-kind="ambiguous"], #status[data-kind="retake"] { color: var(--warn); }
  #status[data-kind="error"], #status[data-kind="not_found"], #status[data-kind="unsupported"] { color: var(--bad); }
  .card { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .card img { width: 96px; border: 1px solid var(--line); }
  .card > div { min-width: 0; }
  .card table { grid-column: 1 / -1; margin-top: 0; }
  .card h2 { font-size: 14px; margin: 0 0 4px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 400; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Card scanner</h1>
    <span class="dim">example for <a href="https://tcgapi.dev/use-cases/card-scanner/">TCG API</a></span>
  </header>

  <div class="box">
    <label class="pick">
      Take or choose a photo
      <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
    </label>
    <img id="preview" alt="The photo you chose" hidden>
  </div>

  <div class="box" aria-live="polite">
    <p id="status" class="dim">One card, graded slab or sealed product per photo.</p>
    <div id="result"></div>
  </div>
</main>

<script>
const MAX_BYTES = 8 * 1024 * 1024;
const input = document.getElementById('photo');
const preview = document.getElementById('preview');
const statusLine = document.getElementById('status');
const result = document.getElementById('result');

// Build elements with textContent only: nothing from the API is ever parsed as HTML.
function el(tag, text, attrs) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
const money = (n) => (n == null ? '—' : '$' + Number(n).toFixed(2));
const pct = (n) => (n == null ? '—' : (n > 0 ? '+' : '') + Number(n).toFixed(1) + '%');

function setStatus(kind, text) {
  statusLine.dataset.kind = kind;
  statusLine.className = '';
  statusLine.textContent = text;
}

function facts(pairs) {
  const dl = el('dl');
  for (const [label, value] of pairs) {
    if (value == null || value === '') continue;
    dl.append(el('dt', label), el('dd', String(value)));
  }
  return dl;
}

function priceTable(prices) {
  const table = el('table');
  const head = el('tr');
  for (const h of ['Printing', 'Market', 'Low', '30 days']) head.append(el('th', h));
  table.append(head);
  for (const p of prices) {
    const row = el('tr');
    row.append(el('td', p.printing), el('td', money(p.market_price)), el('td', money(p.low_price)), el('td', pct(p.price_change_30d)));
    table.append(row);
  }
  return table;
}

function candidate(c) {
  const box = el('div', null, { class: 'card' });
  box.append(c.image_url ? el('img', null, { src: c.image_url, alt: c.name }) : el('div'));
  const body = el('div');
  body.append(el('h2', c.name));
  body.append(facts([
    ['Set', c.set && c.set.name],
    ['Number', c.number],
    ['Rarity', c.rarity],
    ['Printing', c.suggested_printing || (c.printings || []).join(' / ')],
    ['TCGPlayer ID', c.tcgplayer_id],
    ['card_id', c.card_id],
  ]));
  // include=prices returns prices for the top candidate; for another one, call /v1/cards/{card_id}/prices.
  box.append(body);
  if (c.prices && c.prices.length) box.append(priceTable(c.prices));
  return box;
}

function show(data, meta) {
  const cards = data.candidates || [];
  const messages = {
    matched: 'Matched: exactly one printing fits.',
    ambiguous: 'Several printings fit. Let the user pick one:',
    retake: data.message || 'Retake the photo.',
    not_found: 'Nothing in the catalog matches what was read.',
    unsupported: data.message || 'This game or language is not in the catalog.',
  };
  setStatus(data.status, messages[data.status] || data.status);
  // On a retake the candidates are hints from the readable parts, not an answer.
  if (data.status === 'retake' && cards.length) result.append(el('p', 'Possible matches from the readable parts:', { class: 'dim' }));
  for (const c of data.status === 'matched' ? cards.slice(0, 1) : cards) result.append(candidate(c));

  const read = data.read || {};
  const grade = read.grade ? [read.grade.company, read.grade.grade].filter(Boolean).join(' ') : null;
  const seen = [read.name, read.number, read.set, read.stamp, read.finish, grade].filter(Boolean).join(' · ');
  if (seen) result.append(el('p', 'Read from the photo: ' + seen, { class: 'dim' }));
  if (meta && meta.scans_remaining != null) result.append(el('p', 'Scans left: ' + meta.scans_remaining, { class: 'dim' }));
}

input.addEventListener('change', async () => {
  const file = input.files[0];
  if (!file) return;
  result.replaceChildren();
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;

  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return setStatus('error', 'Use a JPEG, PNG or WebP photo.');
  if (file.size > MAX_BYTES) return setStatus('error', 'That photo is over 8 MB. Choose a smaller one.');

  setStatus('', 'Reading the photo… about 3.5 seconds.');
  try {
    // The photo goes to this app's own server, which adds the API key and forwards it.
    const res = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': file.type }, body: file });
    const json = await res.json();
    if (json.error) setStatus('error', json.error.message + (json.error.code ? ' (' + json.error.code + ')' : ''));
    else show(json.data, json.meta);
  } catch {
    setStatus('error', 'The scan request failed. Is the server running?');
  }
  input.value = ''; // so choosing the same photo again scans it again
});
</script>
</body>
</html>
